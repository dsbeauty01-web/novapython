name: Nova daily session rollup

# Build 3: once a day, ask the worker to summarize yesterday's sessions into a
# single game='_daily' row. The heavy lifting (query + one cheap LLM call) runs
# on the worker; this job just pings the endpoint. Idempotent per day.
on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily (~13:17 Ko Samui)
  workflow_dispatch: {}     # allow a manual run from the Actions tab

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/v1/rollup/daily
        env:
          # Optional: set a repo secret NOVA_ROLLUP_SECRET *and* the matching
          # Render env var to lock the endpoint down. If unset, the call is open.
          NOVA_ROLLUP_SECRET: ${{ secrets.NOVA_ROLLUP_SECRET }}
        run: |
          echo "Pinging daily rollup (worker may cold-start ~30-50s)…"
          curl -sS -X POST "https://novapython.onrender.com/api/v1/rollup/daily" \
            -H "Content-Type: application/json" \
            ${NOVA_ROLLUP_SECRET:+-H "X-Rollup-Secret: $NOVA_ROLLUP_SECRET"} \
            --max-time 150 -w "\nHTTP %{http_code}\n"
