<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nova Magic-Light — Synthetic Test Harness</title>
<style>
  :root { --banner: #7ad7ff; }
  html,body{margin:0;height:100%;background:#0b0d12;font-family:system-ui,Arial,sans-serif;color:#cfd6e4}
  #stage{position:relative;width:640px;height:480px;margin:14px auto;border-radius:14px;overflow:hidden;
         background:#11151d url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="%2311151d"/><circle cx="20" cy="20" r="1.5" fill="%231b2230"/></svg>')}
  /* fake "webcam scene" so we can confirm the light reads BRIGHTER than the scene */
  #scene{position:absolute;inset:0;background:linear-gradient(135deg,#243047,#0e1420 60%,#1a2336);opacity:.9}
  #fx{position:absolute;inset:0;width:100%;height:100%}
  #banner{position:absolute;top:8px;left:8px;z-index:5;font-size:12px;font-weight:700;letter-spacing:.5px;
          padding:4px 9px;border-radius:999px;background:var(--banner);color:#08121a;box-shadow:0 1px 6px #0008}
  #nova{position:absolute;right:10px;bottom:10px;width:12vw;max-width:84px;aspect-ratio:1;border-radius:50%;z-index:4;
        background:radial-gradient(circle at 38% 34%,#fff,#ffd27a 45%,#ff9a3d 78%,#b8590a);box-shadow:0 0 22px #ffb14d66}
  #controls{max-width:680px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  button{background:#1b2230;color:#cfd6e4;border:1px solid #2c3850;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px}
  button:hover{background:#232c3e}
  #log{max-width:680px;margin:10px auto;font:12px/1.5 ui-monospace,Consolas,monospace;color:#8fa0bd;
       background:#0e131c;border:1px solid #1c2636;border-radius:8px;padding:8px;height:120px;overflow:auto;white-space:pre-wrap}
  .qrow{display:flex;align-items:center;gap:8px;justify-content:center;margin:4px}
</style>
</head>
<body>
  <div id="banner">NOVA-LIGHT • test-harness • v300</div>
  <div id="stage">
    <div id="scene"></div>
    <canvas id="fx"></canvas>
    <div id="nova" title="Nova orb (≤12vw corner)"></div>
  </div>
  <div id="controls">
    <button data-s="armUp">Arm raise (right wrist ↑)</button>
    <button data-s="armSide">Arm wave (L→R)</button>
    <button data-s="lowConf">Hide arm (conf 0.2) ← the bug test</button>
    <button data-s="near">Close (big body)</button>
    <button data-s="far">Far (small body)</button>
    <button data-s="idle">Idle (no cue)</button>
    <button id="celebrate">Celebrate 🎉</button>
  </div>
  <div class="qrow">quality
    <input id="q" type="range" min="0" max="1" step="0.01" value="0.8" />
    <span id="qv">0.80</span>
  </div>
  <div id="log"></div>

<script src="nova-light.js"></script>
<script>
(function(){
  const logEl = document.getElementById('log');
  const LOG = [];
  function log(m){ LOG.push(m); logEl.textContent = LOG.slice(-40).join('\n'); logEl.scrollTop = logEl.scrollHeight; }
  window.__novaLog = LOG;
  window.addEventListener('error', e => log('PAGE ERROR: ' + e.message));

  const canvas = document.getElementById('fx');
  const nova = NovaLight.create(canvas, {
    version: 'v300', bannerColor: getComputedStyle(document.documentElement).getPropertyValue('--banner'),
  });
  nova.resize();
  window.addEventListener('resize', () => nova.resize());
  window.__nova = nova;
  log('logger init • engine created • banner ok');

  // ---- synthetic skeleton in display space (no camera) -------------------
  // base pose centred in a 640x480 stage; we vary the moving part per scenario.
  function basePose(scale){
    const cx = 320, sy = 200, hipY = 330;
    const sh = 70 * scale;          // half shoulder width
    return {
      left_shoulder:  {x: cx - sh, y: sy, score: .95},
      right_shoulder: {x: cx + sh, y: sy, score: .95},
      left_hip:  {x: cx - sh*0.7, y: hipY, score: .9},
      right_hip: {x: cx + sh*0.7, y: hipY, score: .9},
      left_wrist: {x: cx - sh*1.6, y: sy + 60*scale, score: .9},
      right_elbow:{x: cx + sh*1.3, y: sy + 40*scale, score: .9},
    };
  }

  let scenario = 'armUp';
  let scale = 1;
  let confWrist = 0.95;
  let t0 = performance.now();

  function setScenario(s){
    scenario = s; t0 = performance.now();
    if (s === 'near') scale = 1.7; else if (s === 'far') scale = 0.55; else scale = 1;
    confWrist = (s === 'lowConf') ? 0.2 : 0.95;
    if (s === 'idle') { nova.clearCue(); log('scenario: idle (no cue → breathing shimmer)'); return; }
    if (s === 'armSide') nova.setCue('right_wrist', 'right');
    else nova.setCue('right_wrist', 'up');
    log('scenario: ' + s + (s==='lowConf' ? '  → expect NOTHING drawn at the wrist' : ''));
  }
  window.__setScenario = setScenario;
  document.querySelectorAll('button[data-s]').forEach(b =>
    b.addEventListener('click', () => setScenario(b.dataset.s)));
  document.getElementById('celebrate').addEventListener('click', () => { nova.celebrate(); log('celebrate() → success bloom'); });

  const q = document.getElementById('q'), qv = document.getElementById('qv');
  function applyQ(){ nova.setQuality(+q.value); qv.textContent = (+q.value).toFixed(2); }
  q.addEventListener('input', applyQ); applyQ();

  // ---- drive loop: move the wrist along the cue direction -----------------
  function frame(now){
    const kp = basePose(scale);
    const T = (now - t0) / 1000;
    const cx = 320, sy = 200, sh = 70 * scale;
    let wx, wy;
    if (scenario === 'armSide') {                 // sweep L→R across the body
      wx = cx + Math.sin(T * 1.6) * sh * 2.2;
      wy = sy - 30*scale + Math.cos(T*1.6) * 8;
    } else {                                       // raise: hand rises + small orbit
      wx = cx + sh * 1.5 + Math.cos(T * 2.2) * 22 * scale;
      wy = sy + 80*scale - (Math.min(T,1.4) * 150 * scale) + Math.sin(T*2.2) * 14 * scale;
    }
    kp.right_wrist = { x: wx, y: wy, score: confWrist };
    nova.render(kp, now);
    requestAnimationFrame(frame);
  }
  setScenario('armUp');
  requestAnimationFrame(frame);
  window.__ready = true;
})();
</script>
</body>
</html>
