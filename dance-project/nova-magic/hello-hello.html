<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Nova Dance — Hello Hello</title>
<link rel="stylesheet" href="nova-game.css" />
<style>:root { --banner: #FF9EC8; } /* Hello Hello = soft pink */</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted></video>
  <canvas id="fx"></canvas>
  <div id="banner">HELLO&nbsp;HELLO • v300</div>
  <div id="status">starting…</div>
  <div id="nova" title="Nova"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="nova-light.js"></script>
<script src="nova-game.js"></script>
<script>
  // Hello Hello — ages 4–7, the calmest game: shortest ribbon, gentlest
  // sparkle, softest chevron. A simple two-hand "hello" wave up.
  NovaGame.start({
    config: {
      light: {
        trail: { nodes: 14, waveAmp: 9, headWidth: 13, fade: 0.16 }, // shorter, calmer ribbon
        spark: { gentleness: 0.4 },                                  // gentlest sparkle
        arrow: { len: 38, width: 4, pulse: 1.3 },                    // softest chevron
      },
      sequence: [
        { part: 'right_wrist', dir: 'up', holdMs: 3000, leadMs: 600 },
        { part: 'left_wrist',  dir: 'up', holdMs: 3000, leadMs: 600 },
      ],
    },
  });
</script>
</body>
</html>
