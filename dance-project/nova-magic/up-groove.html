<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Nova Dance — Up Groove</title>
<link rel="stylesheet" href="nova-game.css" />
<style>:root { --banner: #FFC24D; } /* Up Groove = warm gold */</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted></video>
  <canvas id="fx"></canvas>
  <div id="banner">UP&nbsp;GROOVE • v300</div>
  <div id="status">starting…</div>
  <div id="nova" title="Nova"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="nova-light.js"></script>
<script src="nova-game.js"></script>
<script>
  // Up Groove — "hands up and groove." The magic ribbon only reads where there's
  // motion, so we light the WRISTS (always in frame, always moving) rather than
  // the near-still shoulders/hips the build doc named. Legibility wins; the orb
  // rides the hand the kid is actually waving.
  NovaGame.start({
    config: {
      light: { /* engine defaults are tuned for this game */ },
      sequence: [
        { part: 'right_wrist', dir: 'up',   holdMs: 2600 },
        { part: 'left_wrist',  dir: 'up',   holdMs: 2600 },
        { part: 'right_wrist', dir: 'down', holdMs: 2400 },
        { part: 'left_wrist',  dir: 'down', holdMs: 2400 },
      ],
    },
  });
</script>
</body>
</html>
