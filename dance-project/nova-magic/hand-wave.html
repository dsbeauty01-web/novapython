<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Nova Dance — Hand Wave</title>
<link rel="stylesheet" href="nova-game.css" />
<style>:root { --banner: #7AD7FF; } /* Hand Wave = sky blue */</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted></video>
  <canvas id="fx"></canvas>
  <div id="banner">HAND&nbsp;WAVE • v300</div>
  <div id="status">starting…</div>
  <div id="nova" title="Nova"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="nova-light.js"></script>
<script src="nova-game.js"></script>
<script>
  // Hand Wave — wrist → elbow → shoulder, then cross to the opposite side.
  // The camera is mirrored (selfie), so the engine reads the same intuitive
  // side the kid sees; the ribbon leads the wave across L→R.
  NovaGame.start({
    config: {
      sequence: [
        { part: 'right_wrist',    dir: 'right', holdMs: 2400 },
        { part: 'right_elbow',    dir: 'right', holdMs: 2200 },
        { part: 'right_shoulder', dir: 'right', holdMs: 2200 },
        { part: 'left_wrist',     dir: 'left',  holdMs: 2600 }, // cross to the other side
      ],
    },
  });
</script>
</body>
</html>
